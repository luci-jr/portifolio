  <!-- Centro: Nome e Tag Portfólio -->
  <div class="brand">
    <div class="dev-name-glow" title="Lucivaldo Junior — Portfólio">
      <span class="nav-led-dot" title="Status: ONLINE"></span>
      <span class="pixel-bracket">[</span>
      <span class="brand-name">LUCIVALDO JUNIOR</span>
      <span class="pixel-bracket">]</span>
      <span class="brand-portfolio-tag">PORTFÓLIO</span>
    </div>
  </div>

  <!-- Controles do Sistema no Lado Direito: Início, Alternador de Tema (Dark/Light) & Scanlines CRT -->
  <div class="system-controls">
    <!-- Botão Início -->
    <button class="crt-btn nav-home-btn" (click)="scrollToTop()" type="button" title="Ir para o Início" aria-label="Início">
      <span class="home-icon">⌂</span> <span class="home-label">INÍCIO</span>
    </button>

    <!-- Botão Alternador Tema Dark / Light -->
    <button class="crt-btn theme-toggle-btn" (click)="toggleTheme()" type="button" title="Alternar Modo Claro / Escuro">
      TEMA: <span>{{ portfolio.isLight() ? '☀️ LIGHT' : '🌙 DARK' }}</span>
    </button>

    <!-- Botão Trilha Sonora Imersiva Convidativa (Ambient Chill) -->
    <button class="crt-btn audio-toggle-btn" [class.is-playing]="portfolio.audioPlaying()" (click)="portfolio.toggleAudio()" type="button" title="Alternar Trilha Sonora Imersiva (Ambient Chill)" aria-label="Trilha Sonora Imersiva">
      <span class="audio-note-wrap">
        <svg class="audio-note-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
          <line class="audio-slash-line" x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
      </span>
    </button>

    <!-- Botão CRT Scanlines -->
    <button class="crt-btn" (click)="toggleCrt()" type="button" title="Alternar Scanlines CRT">
      CRT: <span>{{ portfolio.crtEnabled() ? 'ON' : 'OFF' }}</span>
    </button>
  </div>
</header>
