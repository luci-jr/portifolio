<!-- Overlay Backdrop da Barra Lateral -->
<div class="sidebar-backdrop" [class.is-open]="portfolio.sidebarOpen()" (click)="close()" aria-hidden="true"></div>

<!-- Barra Lateral Retrátil Estilo iPortfolio Cyberpunk -->
<aside class="sidebar-drawer" [class.is-open]="portfolio.sidebarOpen()" aria-label="Navegação Lateral do Portfólio">
  <!-- Cabeçalho com Botão de Recolher Menu Lateral -->
  <div class="sidebar-header">
    <button class="sidebar-close-btn" (click)="close()" type="button" title="Recolher Menu Lateral" aria-label="Recolher Menu Lateral">
      <span class="collapse-icon">◀</span>
      <span class="collapse-label">RECOLHER</span>
    </button>
  </div>

  <!-- Perfil do Desenvolvedor -->
  <div class="sidebar-profile">
    <div class="sidebar-avatar-wrapper">
      <img src="perfil-navbar.png"
           onerror="if(!this.dataset.tried){this.dataset.tried=1;this.src='public/perfil-navbar.png'}"
           alt="Foto de Lucivaldo Junior"
           class="sidebar-avatar-img">
      <span class="sidebar-status-dot" title="Status: ONLINE"></span>
    </div>
    <h2 class="sidebar-name">
      <span class="pixel-bracket">[</span>LUCIVALDO JUNIOR<span class="pixel-bracket">]</span>
    </h2>
    <p class="sidebar-role">DESENVOLVEDOR BACK-END &amp; SYSOPS</p>

    <!-- Redes Sociais Rápidas -->
    <div class="sidebar-socials">
      <a href="https://github.com/luci-jr" target="_blank" class="sidebar-social-link" title="GitHub de Lucivaldo Junior" aria-label="GitHub">

      </a>
      <a href="https://www.linkedin.com/in/lucivaldojr/" target="_blank" class="sidebar-social-link" title="LinkedIn de Lucivaldo Junior" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>

      </a>
      <a href="mailto:lucivaldojr25@gmail.com" class="sidebar-social-link" title="Enviar Email" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M0 3v18h24v-18h-24zm21.518 2l-9.518 7.713-9.518-7.713h19.036zm-19.518 14v-11.817l10 8.104 10-8.104v11.817h-20z"/>

      </a>

  </div>
